<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Extrator de Leads — Ademicon</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --forest: #3D5238;
    --gold: #C49355;
    --sand: #EDE6D8;
    --charcoal: #1A1A1A;
    --surface: #F5F2EC;
    --border: rgba(61,82,56,0.15);
    --text: #1A1A1A;
    --muted: #6B6660;
    --success: #2D6A4F;
    --error: #C1121F;
    --radius: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--surface);
    color: var(--text);
    min-height: 100vh;
    padding-bottom: 40px;
  }

  header {
    background: var(--forest);
    padding: 18px 20px 14px;
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    max-width: 600px;
    margin: 0 auto;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo-mark {
    width: 32px;
    height: 32px;
    background: var(--gold);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    color: var(--forest);
    letter-spacing: -0.5px;
  }

  .logo-text {
    font-size: 14px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.01em;
  }

  .logo-sub {
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    font-weight: 400;
    font-family: 'IBM Plex Mono', monospace;
  }

  .counter-badge {
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 20px;
    padding: 4px 12px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .main {
    max-width: 600px;
    margin: 0 auto;
    padding: 20px 16px 0;
  }

  /* Upload zone */
  .upload-zone {
    border: 1.5px dashed rgba(61,82,56,0.35);
    border-radius: var(--radius);
    background: #fff;
    padding: 32px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    position: relative;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .upload-zone:hover, .upload-zone.drag-over {
    border-color: var(--forest);
    background: rgba(61,82,56,0.03);
  }

  .upload-zone input[type=file] {
    position: absolute;
    inset: 0;
    opacity: 0;
    cursor: pointer;
  }

  .upload-icon {
    width: 48px;
    height: 48px;
    background: rgba(61,82,56,0.08);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 12px;
  }

  .upload-icon svg { width: 22px; height: 22px; stroke: var(--forest); fill: none; stroke-width: 1.8; stroke-linecap: round; }

  .upload-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 4px;
  }

  .upload-hint {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Thumbnails */
  .thumbs-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }

  .thumb {
    aspect-ratio: 9/16;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
    background: #e8e4dc;
  }

  .thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .thumb .thumb-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
  }

  .thumb.processing .thumb-status { background: rgba(61,82,56,0.6); }
  .thumb.done .thumb-status { background: rgba(45,106,79,0.7); }
  .thumb.error .thumb-status { background: rgba(193,18,31,0.6); }
  .thumb.pending .thumb-status { background: rgba(0,0,0,0.25); }

  .thumb-remove {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 18px;
    height: 18px;
    background: rgba(0,0,0,0.55);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 10px;
    color: #fff;
    line-height: 1;
    border: none;
  }

  /* Progress bar */
  .progress-bar-wrap {
    background: rgba(61,82,56,0.1);
    border-radius: 4px;
    height: 4px;
    margin-bottom: 16px;
    overflow: hidden;
    display: none;
  }

  .progress-bar {
    height: 100%;
    background: var(--forest);
    border-radius: 4px;
    transition: width 0.4s ease;
    width: 0%;
  }

  /* Buttons */
  .btn-row {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .btn {
    flex: 1;
    padding: 14px 16px;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    border: none;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .btn-primary {
    background: var(--forest);
    color: #fff;
  }

  .btn-primary:not(:disabled):hover { background: #2e3e27; }
  .btn-primary:not(:disabled):active { transform: scale(0.98); }

  .btn-secondary {
    background: #fff;
    color: var(--forest);
    border: 1.5px solid rgba(61,82,56,0.3);
  }

  .btn-secondary:not(:disabled):hover { background: var(--sand); }

  /* Results */
  .results-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .results-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--forest);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .results-count {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .lead-card {
    background: #fff;
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }

  .lead-card::before {
    content: '';
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 3px;
    background: var(--forest);
  }

  .lead-card.tipo-servicos::before { background: var(--gold); }
  .lead-card.tipo-auto::before { background: #6B5B95; }

  .lead-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 6px;
  }

  .lead-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 8px;
  }

  .lead-chip {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    padding: 3px 8px;
    border-radius: 20px;
    background: rgba(61,82,56,0.08);
    color: var(--forest);
  }

  .lead-chip.chip-tel { background: rgba(196,147,85,0.12); color: #7a5a28; }
  .lead-chip.chip-valor { background: rgba(61,82,56,0.12); color: var(--forest); font-weight: 500; }

  .lead-produto {
    font-size: 12px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .tipo-badge {
    display: inline-flex;
    align-items: center;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .badge-imoveis { background: rgba(61,82,56,0.1); color: var(--forest); }
  .badge-servicos { background: rgba(196,147,85,0.15); color: #7a5a28; }
  .badge-auto { background: rgba(107,91,149,0.12); color: #4a3a6e; }

  .lead-edit-btn {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 12px;
    transition: all 0.15s;
  }

  .lead-edit-btn:hover { background: var(--sand); color: var(--forest); }

  /* Status bar */
  .status-bar {
    background: rgba(61,82,56,0.06);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 8px;
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--gold);
    animation: pulse 1s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Export button */
  .export-section {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .export-section.visible { display: block; }

  .export-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 10px;
  }

  .export-btn {
    width: 100%;
    padding: 13px;
    background: var(--charcoal);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    font-size: 14px;
    font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    transition: background 0.15s;
    margin-bottom: 8px;
  }

  .export-btn:hover { background: #2d2d2d; }

  .export-hint {
    font-size: 11px;
    color: var(--muted);
    text-align: center;
    font-family: 'IBM Plex Mono', monospace;
  }

  /* Empty state */
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13px;
    display: none;
  }

  .empty-state.visible { display: block; }

  /* Spinner */
  @keyframes spin { to { transform: rotate(360deg); } }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.3);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-text { display: none; }

  /* API key input */
  .api-section {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 16px;
  }

  .api-label {
    font-size: 11px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 8px;
    display: block;
  }

  .api-input-row {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .api-input {
    flex: 1;
    padding: 9px 12px;
    border: 1px solid var(--border);
    border-radius: 7px;
    font-size: 13px;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--text);
    background: var(--surface);
    outline: none;
  }

  .api-input:focus { border-color: var(--forest); }

  .api-save-btn {
    padding: 9px 14px;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 7px;
    font-size: 12px;
    font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
  }

  .api-status {
    font-size: 11px;
    font-family: 'IBM Plex Mono', monospace;
    margin-top: 6px;
    height: 14px;
  }

  .api-status.ok { color: var(--success); }
  .api-status.err { color: var(--error); }

  /* Modal de edição */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    align-items: flex-end;
    padding: 0;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 16px 16px 0 0;
    padding: 20px 16px 32px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
  }

  .modal-title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .modal-close {
    background: none;
    border: none;
    font-size: 20px;
    cursor: pointer;
    color: var(--muted);
    line-height: 1;
  }

  .field-group { margin-bottom: 14px; }

  .field-label {
    font-size: 11px;
    font-weight: 600;
    font-family: 'IBM Plex Mono', monospace;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 5px;
    display: block;
  }

  .field-input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Sora', sans-serif;
    color: var(--text);
    background: var(--surface);
    outline: none;
  }

  .field-input:focus { border-color: var(--forest); }

  .modal-save {
    width: 100%;
    padding: 13px;
    background: var(--forest);
    color: #fff;
    border: none;
    border-radius: 9px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Sora', sans-serif;
    cursor: pointer;
    margin-top: 4px;
  }

  .notice {
    background: rgba(196,147,85,0.1);
    border: 1px solid rgba(196,147,85,0.3);
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 12px;
    color: #7a5a28;
    font-family: 'IBM Plex Mono', monospace;
    margin-bottom: 14px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">
      <div class="logo-mark">T41</div>
      <div>
        <div class="logo-text">Extrator de Leads</div>
        <div class="logo-sub">Ademicon · Reativação</div>
      </div>
    </div>
    <div class="counter-badge" id="counter-badge">0 leads</div>
  </div>
</header>

<div class="main">

  <div class="notice">
    ⚡ Cole sua API Key do Claude uma vez. Depois é só enviar os prints e exportar a planilha.
  </div>

  <!-- API Key -->
  <div class="api-section">
    <label class="api-label">Claude API Key</label>
    <div class="api-input-row">
      <input type="password" class="api-input" id="api-key-input" placeholder="sk-ant-..." autocomplete="off">
      <button class="api-save-btn" onclick="saveApiKey()">Salvar</button>
    </div>
    <div class="api-status" id="api-status"></div>
  </div>

  <!-- Upload zone -->
  <div class="upload-zone" id="upload-zone">
    <input type="file" accept="image/*" multiple id="file-input" onchange="handleFiles(this.files)">
    <div class="upload-icon">
      <svg viewBox="0 0 24 24"><path d="M4 16l4-4 4 4"/><path d="M12 12v8"/><path d="M20 16.7A5 5 0 0 0 18 7h-1.26A8 8 0 1 0 4 15.3"/></svg>
    </div>
    <div class="upload-title">Enviar prints dos leads</div>
    <div class="upload-hint">Toque para selecionar · Múltiplas fotos</div>
  </div>

  <!-- Thumbnails -->
  <div class="thumbs-grid" id="thumbs-grid"></div>

  <!-- Status bar -->
  <div class="status-bar" id="status-bar">
    <div class="status-dot"></div>
    <span id="status-text">Processando...</span>
  </div>

  <!-- Progress -->
  <div class="progress-bar-wrap" id="progress-wrap">
    <div class="progress-bar" id="progress-bar"></div>
  </div>

  <!-- Action buttons -->
  <div class="btn-row">
    <button class="btn btn-primary" id="process-btn" onclick="processAll()" disabled>
      <div class="spinner"></div>
      <span class="btn-text">▶ Extrair dados</span>
    </button>
    <button class="btn btn-secondary" onclick="clearAll()">Limpar</button>
  </div>

  <!-- Results -->
  <div id="results-section">
    <div class="results-header" id="results-header" style="display:none">
      <span class="results-title">Leads extraídos</span>
      <span class="results-count" id="results-count"></span>
    </div>
    <div id="leads-list"></div>
  </div>

  <!-- Export -->
  <div class="export-section" id="export-section">
    <div class="export-title">Exportar</div>
    <button class="export-btn" onclick="exportCSV()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Baixar planilha CSV
    </button>
    <button class="export-btn" style="background:#1A1A1A" onclick="copyJSON()">
      Copiar JSON (Kommo import)
    </button>
    <div class="export-hint">CSV abre direto no Excel e Google Sheets</div>
  </div>

</div>

<!-- Modal de edição -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-title">
      <span>Editar lead</span>
      <button class="modal-close" onclick="closeModalDirect()">×</button>
    </div>
    <div class="field-group">
      <label class="field-label">Nome</label>
      <input type="text" class="field-input" id="edit-nome">
    </div>
    <div class="field-group">
      <label class="field-label">Telefone</label>
      <input type="tel" class="field-input" id="edit-tel">
    </div>
    <div class="field-group">
      <label class="field-label">Email</label>
      <input type="email" class="field-input" id="edit-email">
    </div>
    <div class="field-group">
      <label class="field-label">Segmento</label>
      <select class="field-input" id="edit-segmento">
        <option value="Imóveis">Imóveis</option>
        <option value="Serviços">Serviços</option>
        <option value="Automóveis">Automóveis</option>
        <option value="Outro">Outro</option>
      </select>
    </div>
    <div class="field-group">
      <label class="field-label">Produto</label>
      <input type="text" class="field-input" id="edit-produto">
    </div>
    <div class="field-group">
      <label class="field-label">Valor da simulação</label>
      <input type="text" class="field-input" id="edit-valor">
    </div>
    <button class="modal-save" onclick="saveEdit()">Salvar alterações</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'ademicon_api_key';
let leads = [];
let files = [];
let editIndex = -1;

// Init
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    document.getElementById('api-key-input').value = saved;
    document.getElementById('api-status').textContent = '✓ Key salva';
    document.getElementById('api-status').className = 'api-status ok';
  }
});

function saveApiKey() {
  const val = document.getElementById('api-key-input').value.trim();
  if (!val.startsWith('sk-ant-')) {
    document.getElementById('api-status').textContent = '✗ Formato inválido (deve começar com sk-ant-)';
    document.getElementById('api-status').className = 'api-status err';
    return;
  }
  localStorage.setItem(STORAGE_KEY, val);
  document.getElementById('api-status').textContent = '✓ Key salva com sucesso';
  document.getElementById('api-status').className = 'api-status ok';
}

function getApiKey() {
  return localStorage.getItem(STORAGE_KEY) || document.getElementById('api-key-input').value.trim();
}

// Drag and drop
const zone = document.getElementById('upload-zone');
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => { e.preventDefault(); zone.classList.remove('drag-over'); handleFiles(e.dataTransfer.files); });

function handleFiles(fileList) {
  const newFiles = Array.from(fileList).filter(f => f.type.startsWith('image/'));
  files = [...files, ...newFiles];
  renderThumbs();
  document.getElementById('process-btn').disabled = files.length === 0;
}

function renderThumbs() {
  const grid = document.getElementById('thumbs-grid');
  grid.innerHTML = '';
  files.forEach((file, i) => {
    const div = document.createElement('div');
    div.className = 'thumb pending';
    div.id = `thumb-${i}`;
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    img.onload = () => URL.revokeObjectURL(img.src);
    const status = document.createElement('div');
    status.className = 'thumb-status';
    status.textContent = '';
    const rm = document.createElement('button');
    rm.className = 'thumb-remove';
    rm.textContent = '×';
    rm.onclick = (e) => { e.stopPropagation(); removeFile(i); };
    div.appendChild(img);
    div.appendChild(status);
    div.appendChild(rm);
    grid.appendChild(div);
  });
}

function removeFile(i) {
  files.splice(i, 1);
  renderThumbs();
  document.getElementById('process-btn').disabled = files.length === 0;
}

function setThumbState(i, state, icon) {
  const thumb = document.getElementById(`thumb-${i}`);
  if (!thumb) return;
  thumb.className = `thumb ${state}`;
  thumb.querySelector('.thumb-status').textContent = icon;
}

async function fileToBase64(file) {
  return new Promise((res, rej) => {
    const reader = new FileReader();
    reader.onload = () => res(reader.result.split(',')[1]);
    reader.onerror = rej;
    reader.readAsDataURL(file);
  });
}

async function extractLeadFromImage(file, index) {
  const key = getApiKey();
  if (!key) throw new Error('API Key não configurada');

  const b64 = await fileToBase64(file);
  const mediaType = file.type || 'image/jpeg';

  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 500,
      messages: [{
        role: 'user',
        content: [
          {
            type: 'image',
            source: { type: 'base64', media_type: mediaType, data: b64 }
          },
          {
            type: 'text',
            text: `Extraia os dados deste lead de consórcio Ademicon. Responda APENAS com JSON válido, sem markdown, sem explicação:
{
  "nome": "nome completo do lead",
  "telefone": "telefone com DDD",
  "email": "email se visível, senão null",
  "segmento": "Imóveis ou Serviços ou Automóveis",
  "produto": "nome do produto simulado",
  "valor": "valor da simulação como número apenas ex: 376000.80",
  "status": "Leads Contatados e Qualificados ou outro status visível"
}`
          }
        ]
      }]
    })
  });

  if (!response.ok) {
    const err = await response.json().catch(() => ({}));
    throw new Error(err.error?.message || `Erro ${response.status}`);
  }

  const data = await response.json();
  const text = data.content?.[0]?.text || '{}';
  const clean = text.replace(/```json|```/g, '').trim();
  return JSON.parse(clean);
}

async function processAll() {
  const key = getApiKey();
  if (!key || !key.startsWith('sk-ant-')) {
    alert('Configure sua API Key do Claude primeiro.');
    return;
  }
  if (files.length === 0) return;

  const btn = document.getElementById('process-btn');
  btn.classList.add('loading');
  btn.disabled = true;

  const progressWrap = document.getElementById('progress-wrap');
  const progressBar = document.getElementById('progress-bar');
  const statusBar = document.getElementById('status-bar');
  const statusText = document.getElementById('status-text');

  progressWrap.style.display = 'block';
  statusBar.style.display = 'flex';

  let done = 0;

  for (let i = 0; i < files.length; i++) {
    setThumbState(i, 'processing', '⏳');
    statusText.textContent = `Processando ${i + 1} de ${files.length}...`;

    try {
      const lead = await extractLeadFromImage(files[i], i);
      lead._index = i;
      leads.push(lead);
      setThumbState(i, 'done', '✓');
    } catch (e) {
      console.error('Erro no lead', i, e);
      leads.push({ _index: i, nome: `Lead ${i+1}`, erro: e.message });
      setThumbState(i, 'error', '✗');
    }

    done++;
    progressBar.style.width = `${(done / files.length) * 100}%`;
    await new Promise(r => setTimeout(r, 300));
  }

  statusBar.style.display = 'none';
  btn.classList.remove('loading');
  btn.disabled = false;

  renderLeads();
}

function renderLeads() {
  const list = document.getElementById('leads-list');
  const header = document.getElementById('results-header');
  const countEl = document.getElementById('results-count');
  const exportSec = document.getElementById('export-section');
  const counter = document.getElementById('counter-badge');

  const valid = leads.filter(l => !l.erro);

  if (valid.length === 0) {
    list.innerHTML = '<div class="empty-state visible">Nenhum lead extraído ainda.</div>';
    header.style.display = 'none';
    return;
  }

  header.style.display = 'flex';
  countEl.textContent = `${valid.length} de ${leads.length}`;
  counter.textContent = `${valid.length} leads`;
  exportSec.classList.add('visible');

  list.innerHTML = valid.map((lead, i) => {
    const seg = (lead.segmento || '').toLowerCase();
    const tipoClass = seg.includes('servi') ? 'tipo-servicos' : seg.includes('auto') ? 'tipo-auto' : '';
    const badgeClass = seg.includes('servi') ? 'badge-servicos' : seg.includes('auto') ? 'badge-auto' : 'badge-imoveis';
    const valor = lead.valor ? `R$ ${parseFloat(lead.valor).toLocaleString('pt-BR', {minimumFractionDigits: 2})}` : '—';

    return `
    <div class="lead-card ${tipoClass}">
      <button class="lead-edit-btn" onclick="openEdit(${i})">✎</button>
      <div class="lead-name">${lead.nome || '—'}</div>
      <div class="lead-meta">
        <span class="tipo-badge ${badgeClass}">${lead.segmento || '—'}</span>
        ${lead.telefone ? `<span class="lead-chip chip-tel">📞 ${lead.telefone}</span>` : ''}
        <span class="lead-chip chip-valor">${valor}</span>
      </div>
      <div class="lead-produto">${lead.produto || '—'}${lead.email ? ` · ${lead.email}` : ''}</div>
    </div>`;
  }).join('');
}

function openEdit(i) {
  const valid = leads.filter(l => !l.erro);
  const lead = valid[i];
  editIndex = i;

  document.getElementById('edit-nome').value = lead.nome || '';
  document.getElementById('edit-tel').value = lead.telefone || '';
  document.getElementById('edit-email').value = lead.email || '';
  document.getElementById('edit-segmento').value = lead.segmento || 'Imóveis';
  document.getElementById('edit-produto').value = lead.produto || '';
  document.getElementById('edit-valor').value = lead.valor || '';

  document.getElementById('modal').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal').classList.remove('open');
}

function saveEdit() {
  const valid = leads.filter(l => !l.erro);
  const lead = valid[editIndex];
  lead.nome = document.getElementById('edit-nome').value;
  lead.telefone = document.getElementById('edit-tel').value;
  lead.email = document.getElementById('edit-email').value;
  lead.segmento = document.getElementById('edit-segmento').value;
  lead.produto = document.getElementById('edit-produto').value;
  lead.valor = document.getElementById('edit-valor').value;
  closeModalDirect();
  renderLeads();
}

function clearAll() {
  files = [];
  leads = [];
  document.getElementById('thumbs-grid').innerHTML = '';
  document.getElementById('leads-list').innerHTML = '';
  document.getElementById('results-header').style.display = 'none';
  document.getElementById('export-section').classList.remove('visible');
  document.getElementById('progress-wrap').style.display = 'none';
  document.getElementById('progress-bar').style.width = '0%';
  document.getElementById('process-btn').disabled = true;
  document.getElementById('counter-badge').textContent = '0 leads';
  document.getElementById('file-input').value = '';
}

function exportCSV() {
  const valid = leads.filter(l => !l.erro);
  if (valid.length === 0) return;

  const headers = ['Nome', 'Telefone', 'Email', 'Segmento', 'Produto', 'Valor Simulação (R$)', 'Status', 'Fluxo A/B', 'Data Extração'];
  const today = new Date().toLocaleDateString('pt-BR');

  const rows = valid.map((l, i) => [
    l.nome || '',
    l.telefone || '',
    l.email || '',
    l.segmento || '',
    l.produto || '',
    l.valor || '',
    l.status || 'Lead Reativação',
    i % 2 === 0 ? 'Fluxo A' : 'Fluxo B',
    today
  ]);

  const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `leads_ademicon_${today.replace(/\//g, '-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function copyJSON() {
  const valid = leads.filter(l => !l.erro);
  const json = JSON.stringify(valid.map(l => ({
    name: l.nome,
    phone: l.telefone,
    email: l.email,
    tags: [l.segmento, l.produto].filter(Boolean),
    custom_fields: { valor_simulacao: l.valor, produto: l.produto },
    pipeline_stage: 'Novo (Reativação)',
    ab_test: 'A'
  })), null, 2);
  navigator.clipboard.writeText(json).then(() => alert('JSON copiado!')).catch(() => alert(json));
}
